name: Task Manager CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Install Backend Dependencies
      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      # 4️⃣ Run Backend (basic check)
      - name: Backend build check
        run: |
          cd backend
          echo "Backend ready"

      # 5️⃣ Install Frontend Dependencies
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      # 6️⃣ Build Frontend (important step)
      - name: Build frontend
        run: |
          cd frontend
          npm run build

      # 7️⃣ Success message
      - name: Pipeline completed
        run: echo "CI Pipeline finished successfully 🎉"